<!-- MDReader app icon (source for the app's AppIcon.icns; build.sh renders it via
     scripts/make-icon.swift). A Markdown "#" beside the page it typesets: a bright
     title, a lit subheading, paragraph lines, then two bulleted list items. Matches the
     DataWorx/NovaMail/Secrets/FlexFTP/Runner icon family: dark body, soft glow,
     gradient glyph, hairline edge. Drawn on Apple's macOS icon grid: an 824×824
     rounded square inset 100px in a 1024×1024 canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Olive-tinted charcoal body, lighter at the top. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E25"/>
      <stop offset="1" stop-color="#121410"/>
    </linearGradient>
    <!-- Faint lime glow behind the "#". -->
    <radialGradient id="glow" cx="0.33" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#84CC16" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <!-- "#" colour: pale lime into lime. -->
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="196" y1="400" x2="430" y2="676">
      <stop offset="0" stop-color="#D9F99D"/>
      <stop offset="1" stop-color="#65A30D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Body, glow, and a hairline top highlight for a slightly raised edge. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Nudged up so the "#" and page sit on the optical centre. -->
  <g filter="url(#lift)" transform="translate(0,-18)">
    <!-- The "#": two slanted uprights crossed by two bars. -->
    <path d="M300,410 L268,666 M392,410 L360,666 M212,486 H428 M200,590 H416"
          fill="none" stroke="url(#lime)" stroke-width="52" stroke-linecap="round"/>

    <!-- The typeset page: title, subheading, paragraph lines, bulleted items. -->
    <rect x="500" y="328" width="304" height="52" rx="26" fill="#FAFAFA"/>
    <rect x="500" y="420" width="184" height="52" rx="26" fill="#BEF264"/>
    <rect x="500" y="512" width="304" height="52" rx="26" fill="#D4D4D8"/>

    <circle cx="526" cy="630" r="26" fill="#84CC16"/>
    <rect x="580" y="604" width="210" height="52" rx="26" fill="#A1A1AA"/>

    <circle cx="526" cy="722" r="26" fill="#52525B"/>
    <rect x="580" y="696" width="150" height="52" rx="26" fill="#71717A"/>
  </g>
</svg>
