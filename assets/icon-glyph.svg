<!-- MDReader app icon: the borderless, full-size glyph every platform icon is rendered from
     (`npm run icons`, via scripts/icons.mjs). The same design as icon.svg — a Markdown "#"
     beside the page it typesets — without the tile, redrawn taller and bolder so it fills
     the icon like other taskbar and Dock icons. Mid-tone colors read on light and dark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="80" y1="160" x2="520" y2="900">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="1" stop-color="#65A30D"/>
    </linearGradient>
  </defs>

  <!-- The "#": two slanted uprights crossed by two bars. -->
  <path d="M262,160 L200,864 M422,160 L360,864 M96,380 H486 M80,644 H470"
        fill="none" stroke="url(#lime)" stroke-width="96" stroke-linecap="round"/>

  <!-- The typeset page: title, subheading, paragraph line, two bulleted items. -->
  <rect x="590" y="112" width="402" height="100" rx="50" fill="#84CC16"/>
  <rect x="590" y="287" width="252" height="100" rx="50" fill="#A3E635"/>
  <rect x="590" y="462" width="402" height="100" rx="50" fill="#8A8A93"/>

  <circle cx="640" cy="687" r="50" fill="#84CC16"/>
  <rect x="728" y="637" width="264" height="100" rx="50" fill="#8A8A93"/>

  <circle cx="640" cy="862" r="50" fill="#71717A"/>
  <rect x="728" y="812" width="190" height="100" rx="50" fill="#71717A"/>
</svg>
